name: Build and Publish Latest and Beta Tags

on:
  schedule:
    # Runs every Sunday at 04:00 AM UTC to catch new updates
    - cron: '0 4 * * 0'
  push:
    branches: [ "main" ]
  workflow_dispatch:
    # Allows manual triggers

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Adjusted to match the exact upstream channels
        version: [latest, beta]
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # This creates e.g., ghcr.io/user/your-repo:latest or :beta
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ matrix.version }}
          build-args: |
            MA_VERSION=${{ matrix.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max